root_entity: Pull
summary: 'The Canopy Connect data model is rooted on the Pull - one consumer authorisation against one
  carrier account. Everything else hangs off it: the policies retrieved, the drivers, vehicles, dwellings
  and locations those policies cover, the coverages and premiums on each, the claims/loss events, the
  documents and policy forms produced, and the enrichment records looked up alongside. Monitoring, ServicingAction
  and PolicyCheck are the three lifecycle objects that operate ON a Pull. Widget (a link) and Team are
  the tenancy objects above it.'
