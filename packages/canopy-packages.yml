description: >-
  First-party Canopy Connect client distributions. Canopy Connect ships two
  browser/mobile embed products rather than server-side API SDKs: the Canopy
  Connect SDK (a hosted widget loader served from cdn.usecanopy.com) and Canopy
  Connect Components (a tokenizing UI element library served from
  components.usecanopy.com, with an npm loader package). There is no first-party
  server SDK for the REST API in any language registry we probed - the
  Authentication guide shows raw cURL/Node/Python HTTP Basic examples instead.
