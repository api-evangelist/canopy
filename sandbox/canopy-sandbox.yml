time_simulation:
  supported: false
  note: No test clock. Time-dependent scenarios are covered instead by fixed-outcome users (user_good_flood_expiring
    = expires in 15 days, user_good_flood_expired = expired 15 days ago).
caveats:
- The provider states these are sample cases and advises building your own JSON mocks if you need more
  realistic or unique data.
- Sandbox credentials are rejected on production widgets/links.
