source: https://docs.usecanopy.com/reference/sandbox-credentials
provider: Canopy Connect
providerId: canopy
summary: 'Canopy Connect runs a full parallel sandbox environment rather than a dry-run flag. Sandbox
  and production are separated at the KEY level and at the LINK level: a sandbox API key only reads data
  submitted on a sandbox widget/link, a production key only reads production data, and mixing them returns
  400 INCORRECT_API_KEY_TYPE. The provider publishes a large, openly documented catalogue of magic test
  carrier credentials that drive named scenarios - MFA challenges, locked accounts, provider errors, life/commercial/flood
  policy mixes, compliant vs non-compliant limits for Policy Check testing, and stable data for diffing.'
environments:
- name: sandbox
  key_type: Sandbox API Key
  console: https://app.usecanopy.com/dashboard/settings/api-settings
  note: Sandbox keys work only against sandbox links/widgets. Free of charge on the API Sandbox plan.
- name: production
  key_type: Production API Key
  note: Production keys cannot access data submitted on sandbox links.
enablement:
  self_serve: false
  note: Creating a sandbox link is NOT fully self-serve. The provider instructs you to create a widget
    at https://app.usecanopy.com/dashboard/customize and then email support@usecanopy.com with the subject
    "Covert widget to sandbox" including the widget URL. That is a human step between an agent and a working
    test environment.
  source: https://docs.usecanopy.com/reference/sandbox-credentials
test_credential_count: 42
