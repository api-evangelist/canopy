description: >-
  Canopy Connect's published API plan page (https://www.usecanopy.com/api/api-plans,
  HTTP 200 on 2026-09-05). Three tiers are named. Exactly ONE carries a price:
  the API Sandbox tier is free. Both production tiers are "Contact Us" with no
  published price, no published quota, no published overage rate and no
  published rate limit. What follows is transcribed from the provider's page;
  nothing is estimated.
  This file REPLACES a 2026-05-04 bulk-sweep scaffold that had invented three
  tiers with fabricated quotas (1,000 and 100,000 requests/month) and
  fabricated rate limits (10/100/1000 rpm). None of those numbers were ever
  published by Canopy Connect.
