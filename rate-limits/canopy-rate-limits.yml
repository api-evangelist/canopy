description: >-
  Canopy Connect publishes NO rate limits. Searched the complete documentation
  index (https://docs.usecanopy.com/llms.txt, 123 pages) and the full OpenAPI on
  2026-09-05: there is no rate-limit page, no quota table, no throttling section,
  no 429 response declared on any of the 54 operations, and no
  X-RateLimit-*/RateLimit-*/Retry-After header in any response definition. The
  API plan page names three tiers but attaches no request quota to any of them.
  An honest zero is recorded rather than an invented ceiling.
  This file REPLACES a 2026-05-04 bulk-sweep scaffold that had invented
  per-minute limits (10/100/1000 rpm), monthly quotas (1,000/100,000), burst
  ceilings and a full header set. None of that was ever published by Canopy
  Connect.
limit_count: 0
