  published: false
  limit: null
  remaining: null
  reset: null
  retryAfter: null
  policy: null
  note: No rate-limit response header is documented or declared in the spec.
responseCodes:
  throttled: null
  note: >-
    429 is not declared on any operation. The declared error statuses are 400,
    401, 403, 404 and 500, and none of the 48 documented error codes describes
    throttling or quota exhaustion.
observed:
  probed: false
  note: >-
    Not measured against a live authenticated endpoint - this pipeline holds no
    Canopy Connect credentials and does not probe production limits.
evidence:
  - url: https://docs.usecanopy.com/llms.txt
    status: 200
    finding: 123-page docs index contains no rate-limit, throttling or quota page.
  - url: https://docs.usecanopy.com/openapi/documentation.json
    status: 200
    finding: 54 operations, zero 429 responses, zero rate-limit headers.
  - url: https://www.usecanopy.com/api/api-plans
    status: 200
    finding: three tiers named, no request quota or rate ceiling attached to any of them.
gaps:
  - >-
    An agent integrating Canopy Connect has no published way to know how fast it
    may call, no runtime signal when it is close to a limit, and no documented
    status code or header telling it to back off. Combined with the absence of
    idempotency keys (conventions/canopy-conventions.yml), a retry after a
    timeout is unguided in both directions.
