            type: object
            properties:
              type:
                enum:
                - REMOVE_MORTGAGEE
              payload:
                type: object
                description: Input required for a `ServicingAction`. Corresponds with the `type`.
                required:
                - carrier_policy_number
                - mortgagee_type
                properties:
                  carrier_policy_number:
                    type: string
                    example: HO132483
                  mortgagee_type:
                    enum:
                    - FIRST
                    - SECOND
                    - THIRD
            required:
            - type
            - payload
          - type: object
            properties:
              confirmation_data:
                type: object
                properties:
                  carrier_policy_number:
                    type: string
                    example: HO132483
                  before:
                    type: object
                    description: The old mortgagee before the change is applied.
                    required:
                    - name
                    - address
                    - loan_number
                    - mortgagee_type
                    properties:
                      name:
                        type: string
                        example: JP MORGAN CHASE BANK NA ISAOA ATIMA
                      address:
                        type: string
                        example: PO BOX 47020, ATLANTA, GA 30362
                      loan_number:
                        type: string
                        example: '1234567890'
                      mortgagee_type:
                        enum:
                        - FIRST
                        - SECOND
                        - THIRD
                  after:
                    type:
                    - 'null'
                required:
                - carrier_policy_number
                - before
                - after
                description: Output provided for confirmation. Corresponds with the `type`.
        - type: object
          title: AddVehicle
