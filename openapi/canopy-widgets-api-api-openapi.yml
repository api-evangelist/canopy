components:
  schemas:
    Widget:
      title: Widget
      type: object
      properties:
        widget_id:
          type: string
          format: uuid
          description: A unique identifier for the Widget.
        intro_title:
          type: string
          description: The message displayed upon the introduction of the Widget flow.
        public_alias:
          type: string
          description: The public identifier for the Widget (eg. demo => https://app.usecanopy.com/c/demo). When not explicitly set, a public_alias will be auto generated.
        company_name:
          type: string
          description: The company name presented in the Widget flow.
        success_message:
          type: string
          description: The message displayed upon successful completion of the Widget flow.
        on_success_redirect_url:
          type:
          - string
          - 'null'
          description: The URL the user is taken to upon successful completion of the Widget flow.
        is_sandbox:
          type: boolean
          description: Whether or not the Widget is in sandbox mode (as opposed to production mode).
        brand_color_hex:
          type: string
          description: RRGGBB hexadecimal string used for color theming in the Widget flow.
        cobranded_intro_screen:
          type: boolean
          description: Whether the enhanced “cobranded” introduction screen is enabled for the Widget flow.
        public_url:
          type: string
          description: The fully qualified public URL for the Widget flow (eg. https://app.usecanopy.com/c/demo).
        logo_src:
          type:
          - string
          - 'null'
          description: The fully qualified public URL for the logo image displayed in the Widget flow.
        icon_src:
          type:
          - string
          - 'null'
          description: The fully qualified public URL for the icon image shown in the Widget flow when cobranded_intro_screen is enabled.
        agents:
          type: array
          description: List of agents
          items:
            $ref: '#/components/schemas/Agent'
    Agent:
      title: Agent
      type: object
      properties:
        agent_id:
          type: string
          format: uuid
          description: A unique identifier for the Agent.
        email:
          type: string
          description: Agent's email
          format: email
        first_name:
          type: string
          description: Agent's first name
        last_name:
          type: string
          description: Agent's last name
        role:
          type: string
          enum:
          - ADMIN
          - AGENT
          description: Agent's Role
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication. Use your Canopy Connect Client ID as the username and your Client Secret as the password. The `Authorization` header value is `Basic <base64 of clientId:clientSecret>`. See the [Authentication guide](https://docs.usecanopy.com/reference/authentication-guide) for a full walkthrough, and create or manage your Client ID and Client Secret on the [API Settings page](https://app.usecanopy.com/dashboard/settings/api-settings).
