  /teams/{teamId}/widgets/{widgetId}/logo:
    parameters:
    - schema:
        type: string
        format: uuid
      name: teamId
      in: path
      required: true
    - schema:
        type: string
        format: uuid
      name: widgetId
      in: path
      required: true
    put:
      summary: PUT /:widgetId/logo
      operationId: put-widgetId-logo
      responses:
        '200':
          description: 200 Response Schema
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    default: true
                  widget:
