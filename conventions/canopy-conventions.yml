async_and_events:
  model: webhook-callback
  note: >-
    The Pull lifecycle is asynchronous. A caller starts a Pull, then learns of
    progress through webhook events (AUTH_STATUS, POLICY_AVAILABLE,
    POLICIES_AVAILABLE, COMPLETE, ERROR, DATA_UPDATED, MONITORING_RECONNECT,
    MONITORING_EVENTS, SERVICING_WAITING_FOR_CONSUMER_CONFIRMATION) rather than
    by polling. Detail in asyncapi/canopy-webhooks.yml.
file_delivery:
  pattern: 302-redirect-to-signed-url
  note: >-
    Document, policy-form and consumer-file downloads respond with a 302 to a
    short-lived signed URL, and return that same URL in a JSON body so a client
    can read it instead of following the redirect. The superseded *_pdf
    operations streamed bytes through the API and are deprecated.
  source: https://docs.usecanopy.com/reference/pulls-api-downloading-files
dry_run_mode:
  supported: false
  substitute: sandbox
  note: >-
    There is no dry-run/preview/validate-only flag on any operation. Canopy
    substitutes a full parallel sandbox environment with its own key type and
    43 published test credentials - see sandbox/canopy-sandbox.yml. That lets an
    agent rehearse a flow in a separate environment, but it cannot rehearse a
    call against production data.
reversibility:
  grade: documented
  applies: true
  summary: >-
    Four of the five resource families Canopy Connect lets you create have a
    real reversal operation, and the Pull archive flag is a symmetric toggle.
    NOT ONE of them carries a published time window, retention period, or
    statement of what reversal actually does to the underlying data - so this
    grades `documented`, not `verified`. The consequential write in this API is
    also the one with no reversal at all: a Pull is a real credentialed
    retrieval of a consumer's insurance data from a carrier, and nothing in the
    published surface un-does it.
  write_surfaces:
    - operation: post-webhooks
      creates: Webhook
      reversal: delete-webhook
      reversal_method: DELETE /teams/{teamId}/webhooks/{webhookId}
      window: null
      window_source: null
      note: Full delete. An App may only delete webhooks it created itself.
    - operation: post-widgets
      creates: Widget (link)
      reversal: delete-widgetId
      reversal_method: DELETE /teams/{teamId}/widgets/{widgetId}
      window: null
      window_source: null
      note: >-
        Full delete. No documented statement of whether Pulls already collected
        through that widget survive it.
    - operation: post-monitoring
      creates: Monitoring (recurring carrier refresh)
      reversal: delete-monitoring
      reversal_method: DELETE /teams/{teamId}/monitorings/{monitoringId}
      window: null
      window_source: null
      note: >-
        The provider describes this as "stop/pause a Monitoring", not delete.
        patch-monitoring can also set status, stop_after_date or next_pull_date,
        so a Monitoring can be wound back without being destroyed. The only
        published time constraint is forward-looking, not a reversal window:
        interval must be >= 30 days and next_pull_date must be >= 30 days after
        the latest Pull.
    - operation: create-team
      creates: Team
      reversal: delete-team
      reversal_method: DELETE /teams/{teamId}
      window: null
      window_source: null
      note: >-
        Described as "deprovision a team". No published statement of whether
        deprovisioning is recoverable, or what happens to the Team's Pulls.
    - operation: patch-pull-by-id
      creates: null
      reversal: patch-pull-by-id
      reversal_method: PATCH /teams/{teamId}/pulls/{pullId} with is_archived
      window: null
      window_source: null
      note: >-
        Symmetric toggle - the only field the operation accepts is the boolean
        is_archived, so archiving is reversed by the same call. Effectively
        self-reversing.
    - operation: post-consent-and-connect
      creates: Pull (a live credentialed retrieval from the carrier)
      reversal: null
      window: null
      window_source: null
      note: >-
        NO REVERSAL. Nothing in the published surface cancels an in-flight Pull
        or deletes a completed one. An agent that fires this cannot take it
        back; it can only archive the resulting Pull.
    - operation: post-consent-and-documents
      creates: Pull from uploaded documents
      reversal: null
      window: null
      window_source: null
      note: NO REVERSAL. Same as post-consent-and-connect.
    - operation: post-policy-search
      creates: Credential-less policy search (billable lookup)
      reversal: null
      window: null
      window_source: null
      note: NO REVERSAL and no cancel. Nothing documents whether a search can be voided.
    - operation: post-servicings
      creates: ServicingAction against a live carrier policy
      reversal: null
      window: null
      window_source: null
      note: >-
        NO REVERSAL OPERATION. A ServicingAction changes a real policy at the
        carrier (e.g. ADD_MORTGAGEE). The status enum is one-directional
        (QUEUED -> IN_PROGRESS -> ... -> SUCCESS) with no CANCELLED or REVERSED
        state, and there is no DELETE. This is the highest-consequence write in
        the API and the least reversible.
    - operation: post-policy-check-team-settings
      creates: Team-wide Policy Check configuration
      reversal: post-policy-check-team-settings
      reversal_method: POST /teams/{teamId}/policyChecks/settings with the prior configuration
      window: null
      window_source: null
      note: >-
        Overwrite-in-place. Reversible only if the caller saved the previous
        settings first via get-policy-check-team-settings; the provider keeps no
        history and offers no restore.
  gaps:
    - No reversal window, retention period or grace period is stated anywhere for any operation.
    - No cancel path for an in-flight Pull, policy search or ServicingAction.
    - No soft-delete/restore semantics documented for any DELETE.
