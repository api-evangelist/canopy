  mechanism: pullMetaData
  note: >-
    The SDK handler accepts an arbitrary pullMetaData object
    (CanopyConnect.create({ publicAlias, pullMetaData })) that is attached to
    the resulting Pull, which is how a caller correlates a Pull to its own user
    record.
  source: https://docs.usecanopy.com/reference/using-the-sdk
