auth:
  style: http-basic
  header: 'Authorization: Basic <base64(client_id:client_secret)>'
  alternate: x-canopy-client-id / x-canopy-client-secret headers (own-Team calls only)
  oauth_apps: 'Authorization: Bearer <access_token> - Apps acting on another Team'
  detail: authentication/canopy-authentication.yml
idempotency:
  supported: false
  coverage: none
  header: null
  scope: []
  retention: null
  evidence: >-
    No Idempotency-Key (or equivalent) header appears anywhere in
    openapi/canopy-openapi.json - no parameter, no header, no securityScheme,
    no vendor extension - and no Canopy Connect docs page describes replay
    protection, request keys, or safe retry semantics. Searched the docs index
    at https://docs.usecanopy.com/llms.txt (123 pages) and the full OpenAPI on
    2026-09-05.
    The closest thing to replay protection is a business-rule guard rather than
    an idempotency mechanism: POST /monitorings/:monitoringId/refresh rejects a
    duplicate in-flight refresh with 400 CURRENTLY_REFRESHING, and POST
    /webhooks rejects a duplicate registration with 400 ALREADY_EXISTS. Those
    protect two specific resources; they do not make the mutating surface
    replay-safe.
  mutating_operations: 19
  note: >-
    An agent retrying a timed-out POST /widget/pull/consentAndConnect, POST
    /policySearch or POST /servicings has no published way to avoid creating a
    second Pull, a second billable search, or a second servicing action.
pagination:
  style: limit-offset
  applies_to:
    - get-pulls
  parameters:
    - name: limit
      in: query
      type: integer
      default: 10
      minimum: 1
      maximum: 100
    - name: offset
      in: query
      type: integer
    - name: since
      in: query
      type: string
      format: date-time
      description: Filter by Pulls that occurred since the supplied date (inclusive).
    - name: before
      in: query
      type: string
      format: date-time
      description: Filter by Pulls that occurred before the supplied date (inclusive).
  response_fields: []
  cursor: false
  note: >-
    Offset pagination on the Pulls list only. No total count, no next/prev link
    and no cursor are returned, so a client cannot tell whether more pages
    exist without requesting one. Other collection endpoints (GET /monitorings,
    GET /webhooks, GET /widgets, GET /servicings) declare no paging parameters
    at all.
filtering:
  supported: true
  note: >-
    GET /monitorings filters by Pull ID or status; GET /pulls filters by a
    since/before date window. There is no generic filter grammar.
field_expansion:
